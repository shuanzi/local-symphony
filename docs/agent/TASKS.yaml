version: 1
project: local-symphony-app-v1
source_of_truth:
  - api/openapi.yaml
  - db/schema/app_v1.sql
  - db/schema/project_v1.sql
  - docs/AGENT_IMPLEMENTATION_GUIDE.md
  - docs/implementation
  - docs/security/SECURITY_MODEL.md
  - docs/agent/ACCEPTANCE.md
forbidden:
  - implement Linear dependency
  - implement automatic retry timers
  - implement git push, PR creation, merge, or publish
  - implement automatic workspace delete/reset/clean
  - expose raw prompt or raw Codex logs through v1 API
  - let handoff.submit transition issue state directly
  - default CI real Codex calls
phases:
  - id: M0
    title: Contracts and scaffolding
    source_docs:
      - api/openapi.yaml
      - db/schema/app_v1.sql
      - db/schema/project_v1.sql
      - docs/implementation/IS-014-store-contract.md
      - docs/implementation/IS-015-codex-protocol-fixture.md
    acceptance:
      - OpenAPI validates
      - SQLite schema scripts initialize in-memory DBs
      - project/app DB version checks fail safely on unsupported version
      - fake runner interface exists
      - acceptance test harness exists
  - id: M1
    title: Local tracker and store
    depends_on: [M0]
    source_docs:
      - docs/implementation/IS-002-sqlite-schema-v1.md
      - docs/schema/normalized-issue-v1.md
      - docs/implementation/IS-014-store-contract.md
    acceptance:
      - issue CRUD without Linear
      - issue identifiers and sequence numbers are transactionally allocated
      - blockers affect dispatch eligibility
      - state history and comments persist
  - id: M2
    title: Workflow, prompt, and workspace
    depends_on: [M1]
    source_docs:
      - docs/implementation/IS-005-workflow-prompt.md
      - docs/implementation/IS-007-workspace-git-implementation.md
      - docs/config/workflow-reference-v1.md
    acceptance:
      - WORKFLOW.md validates with fixed Human Review handoff target
      - prompt renders strict Liquid context
      - after_create then before_run order on new workspace
      - before_run only on reused workspace
  - id: M3
    title: Orchestrator and fake runner
    depends_on: [M1, M2]
    source_docs:
      - docs/implementation/IS-006-orchestrator-run-lifecycle.md
      - docs/agent/ACCEPTANCE.md
    acceptance:
      - single actor owns dispatch and outcomes
      - failure pauses dispatch
      - operator cancel and approval cancel_run do not redispatch
      - startup stale active runs are interrupted
  - id: M4
    title: Tool gateway and handoff
    depends_on: [M3]
    source_docs:
      - docs/implementation/IS-004-cli-tool-gateway.md
      - docs/security/SECURITY_MODEL.md
    acceptance:
      - tool tokens enforce run/issue/cwd/tool scope
      - handoff payload hash is canonical and idempotent
      - issue.block cancels current run with agent_blocked
      - followup.create creates Inbox issue and followup_of relation
  - id: M5
    title: Review packet and Human Review gate
    depends_on: [M4]
    source_docs:
      - docs/implementation/IS-010-review-packet-artifacts.md
      - docs/implementation/IS-016-rework-flow.md
    acceptance:
      - review packet includes untracked file content
      - after_run output is captured before review packet generation
      - review packet failure prevents Human Review
      - rework packet is cumulative from base_sha
  - id: M6
    title: API, CLI, and dashboard
    depends_on: [M5]
    source_docs:
      - api/openapi.yaml
      - docs/implementation/IS-003-openapi-v1.md
      - docs/implementation/IS-011-frontend-dashboard.md
    acceptance:
      - handlers conform to OpenAPI
      - CLI commands match API side effects
      - dashboard can review, approve, cancel, pause/resume, and inspect diagnostics
  - id: M7
    title: Codex adapter
    depends_on: [M5]
    source_docs:
      - docs/implementation/IS-008-codex-adapter-approval-bridge.md
      - docs/implementation/IS-015-codex-protocol-fixture.md
    acceptance:
      - unsupported Codex version fails before dispatch
      - approval bridge maps decisions correctly
      - timeout and cancellation semantics match IS-006
      - real Codex tests are opt-in only
  - id: M8
    title: Release hardening
    depends_on: [M6, M7]
    source_docs:
      - docs/implementation/IS-012-testing-release.md
      - docs/agent/DEFINITION_OF_DONE.md
      - docs/user/QUICKSTART.md
      - docs/user/KNOWN_LIMITATIONS.md
    acceptance:
      - definition of done satisfied
      - security regressions pass
      - release binary built
      - docs match implemented CLI/API behavior
