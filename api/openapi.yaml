openapi: 3.1.0
info:
  title: Local Symphony App v1 API
  version: 1.0.0
  description: REST/SSE API contract for Local Symphony App v1. All business JSON success responses use the `{data, meta}` envelope.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "18080"
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HealthEnvelope' } } } }
  /state:
    get:
      operationId: getState
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppStateEnvelope' } } } }
        "401": { $ref: '#/components/responses/Error' }
  /events:
    get:
      operationId: listEvents
      parameters:
        - { name: after_seq, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunEventListEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid after_seq }
  /events/stream:
    get:
      operationId: streamEvents
      parameters: [ { $ref: '#/components/parameters/LastEventID' } ]
      responses:
        "200": { description: SSE stream, content: { text/event-stream: { schema: { type: string } } } }
  /auth/exchange:
    post:
      operationId: exchangeOpenToken
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [open_token], additionalProperties: false, properties: { open_token: { type: string, minLength: 16 } } } } }
      responses:
        "200": { description: Browser session established, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSessionEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid mutation request body }
        "401": { $ref: '#/components/responses/Error' }
  /auth/session:
    get:
      operationId: getSession
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSessionEnvelope' } } } }
  /auth/logout:
    post:
      operationId: logout
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      responses:
        "200": { description: Logged out, content: { application/json: { schema: { $ref: '#/components/schemas/LogoutEnvelope' } } } }
  /auth/open-token:
    post:
      operationId: createOpenToken
      description: >
        Used by CLI/open flow to mint a one-time browser open token. Requires a
        bearer local operator credential; cookie-authenticated browser sessions
        are not applicable for this endpoint, so X-Symphony-CSRF is not required.
      security:
        - bearerAuth: []
      responses:
        "200": { description: Open token, content: { application/json: { schema: { $ref: '#/components/schemas/OpenTokenEnvelope' } } } }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }
  /auth/cli-token/rotate:
    post:
      operationId: rotateCliToken
      description: Rotates the bearer CLI credential used for local operator API calls. Requires the current CLI bearer token and returns its replacement.
      security:
        - bearerAuth: []
      responses:
        "200": { description: Rotated CLI token, content: { application/json: { schema: { $ref: '#/components/schemas/CliTokenEnvelope' } } } }
        "401": { $ref: '#/components/responses/Error' }
  /auth/cli-sessions/current:
    delete:
      operationId: revokeCliSession
      description: Revokes the bearer CLI credential presented on this request. Idempotent: revoking an already-revoked or unrecognized token returns 200 with revoked=true. This is the server-side half of `symphony login --logout` so a copied bearer token cannot continue to authorize mutating REST calls after the operator believes they are logged out.
      security:
        - bearerAuth: []
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { type: object, required: [revoked, matched], additionalProperties: false, properties: { revoked: { type: boolean }, matched: { type: boolean } } } } }
        "401": { $ref: '#/components/responses/Error' }
  /issues:
    get:
      operationId: listIssues
      parameters:
        - { name: state, in: query, description: Repeatable issue state filter; server also accepts comma-separated values., style: form, explode: true, schema: { type: array, items: { $ref: '#/components/schemas/IssueState' } } }
        - { name: label, in: query, description: Repeatable label filter; server also accepts comma-separated values., style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: q, in: query, schema: { type: string } }
        - { name: dispatch_paused, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: sort, in: query, schema: { type: string, enum: [priority, updated, identifier], default: priority } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueListEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid query/filter/sort/cursor }
    post:
      operationId: createIssue
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IssueCreateRequest' } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error' }
  /issues/{issue_ref}:
    get:
      operationId: getIssue
      parameters: [ { $ref: '#/components/parameters/IssueRef' } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "404": { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateIssue
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IssuePatchRequest' } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid mutation request body }
  /issues/{issue_ref}/transition:
    post:
      operationId: transitionIssue
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IssueTransitionRequest' } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid mutation request body }
        "409": { $ref: '#/components/responses/Error' }
  /issues/{issue_ref}/comments:
    post:
      operationId: createIssueComment
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], additionalProperties: false, properties: { body: { type: string, minLength: 1, pattern: "\\S" } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid mutation request body }
  /issues/{issue_ref}/dispatch:
    post:
      operationId: dispatchIssue
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      responses:
        "200": { description: Dispatch accepted, content: { application/json: { schema: { $ref: '#/components/schemas/DispatchEnvelope' } } } }
        "409": { $ref: '#/components/responses/Error' }
  /issues/{issue_ref}/dispatch-pause:
    post:
      operationId: pauseIssueDispatch
      description: Pauses dispatch for a non-terminal issue with no active run, recording the operator reason, which must be non-empty after trimming, in pause fields, event log, and issue comments.
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { description: Operator reason for audit comment/event; must be non-empty after trimming., required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1, pattern: "\\S" } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }, "400": { $ref: '#/components/responses/Error', description: "invalid_request when reason is missing or blank." }, "409": { $ref: '#/components/responses/Error', description: "invalid_state_transition when issue state is Done, Cancelled, or Duplicate; issue_already_running when an active run exists." } }
  /issues/{issue_ref}/dispatch-resume:
    post:
      operationId: resumeIssueDispatch
      description: Resumes dispatch for a non-terminal issue with no active run by clearing only dispatch pause fields; it never changes issue content, blockers, state, or creates a run.
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { description: Operator reason for audit comment/event; must be non-empty after trimming., required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1, pattern: "\\S" } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }, "400": { $ref: '#/components/responses/Error', description: "invalid_request when reason is missing or blank." }, "409": { $ref: '#/components/responses/Error', description: "invalid_state_transition when issue state is Done, Cancelled, or Duplicate; issue_already_running when an active run exists." } }
  /issues/{issue_ref}/blockers:
    post:
      operationId: addIssueBlocker
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [blocked_by], additionalProperties: false, properties: { blocked_by: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }, "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid mutation request body } }
  /issues/{issue_ref}/blockers/{blocker_issue_ref}:
    delete:
      operationId: removeIssueBlocker
      parameters:
        - { $ref: '#/components/parameters/IssueRef' }
        - { name: blocker_issue_ref, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/SymphonyCSRF' }
      x-csrf-required-for-cookie-auth: true
      responses: { "200": { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } } }
  /issues/{issue_ref}/duplicates/{canonical_issue_ref}:
    delete:
      operationId: removeIssueDuplicateRelation
      parameters:
        - { $ref: '#/components/parameters/IssueRef' }
        - { name: canonical_issue_ref, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/SymphonyCSRF' }
      x-csrf-required-for-cookie-auth: true
      responses:
        "200": { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: "invalid_request for malformed, self, cross-project, or invalid duplicate refs; no mutation is applied." }
        "404": { $ref: '#/components/responses/Error', description: "not_found when issue_ref or canonical_issue_ref is unresolved; no mutation is applied." }
  /issues/{issue_ref}/events/stream:
    get:
      operationId: streamIssueEvents
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/LastEventID' } ]
      responses: { "200": { description: SSE stream, content: { text/event-stream: { schema: { type: string } } } } }
  /runs:
    get:
      operationId: listRuns
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunListEnvelope' } } } } }
  /runs/{run_id}:
    get:
      operationId: getRun
      parameters: [ { $ref: '#/components/parameters/RunId' } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } } } } }
  /runs/{run_id}/events:
    get:
      operationId: listRunEvents
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: after_seq, in: query, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunEventListEnvelope' } } } }, "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid after_seq } }
  /runs/{run_id}/events/stream:
    get:
      operationId: streamRunEvents
      parameters: [ { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/LastEventID' } ]
      responses: { "200": { description: SSE stream, content: { text/event-stream: { schema: { type: string } } } } }
  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters: [ { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { reason: { type: string } } } } } }
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: "invalid_request for malformed JSON." }
        "409": { $ref: '#/components/responses/Error', description: "invalid_state_transition when the run is not active." }
  /approvals:
    get:
      operationId: listApprovals
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalListEnvelope' } } } } }
  /approvals/{approval_id}/decide:
    post:
      operationId: decideApproval
      parameters: [ { $ref: '#/components/parameters/ApprovalId' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: "invalid_request for malformed JSON or unsupported decision values." }
        "409": { $ref: '#/components/responses/Error', description: "approval_not_pending when approval is not pending; transactionally read-only with no side effects." }
  /reviews/{issue_ref}:
    get:
      operationId: getLatestReview
      parameters: [ { $ref: '#/components/parameters/IssueRef' } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPacketEnvelope' } } } }
        "404": { $ref: '#/components/responses/Error', description: "not_found when issue_ref is unresolved." }
        "409": { $ref: '#/components/responses/Error', description: "review_packet_required when the issue has no review packet row." }
  /reviews/{issue_ref}/send-to-rework:
    post:
      operationId: sendToRework
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1, pattern: "\\S" } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: "invalid_request when reason is missing or blank." }
        "409": { $ref: '#/components/responses/Error', description: "invalid_state_transition when issue is not in Human Review; review_packet_required when latest review packet row is missing, non-generated, or mismatched with the latest completed handoff run; issue_already_running when an active run exists." }
  /reviews/{issue_ref}/mark-done:
    post:
      operationId: markDone
      description: Requires the latest review packet row to be generated and belong to the latest completed handoff run, with issue in Human Review and no active run.
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1, pattern: "\\S" } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: "invalid_request when reason is missing or blank." }
        "409": { $ref: '#/components/responses/Error', description: "invalid_state_transition when issue is not in Human Review; review_packet_required when latest review packet row is missing, non-generated, or mismatched with the latest completed handoff run; issue_already_running when an active run exists." }
  /artifacts/{artifact_id}:
    get:
      operationId: getArtifactMetadata
      parameters: [ { $ref: '#/components/parameters/ArtifactId' } ]
      responses: { "200": { description: Artifact metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactEnvelope' } } } } }
  /artifacts/{artifact_id}/content:
    get:
      operationId: getArtifactContent
      parameters: [ { $ref: '#/components/parameters/ArtifactId' } ]
      responses: { "200": { description: Artifact content, content: { application/octet-stream: { schema: { type: string, format: binary } } } }, "403": { $ref: '#/components/responses/Error' } }
  /workflow:
    get:
      operationId: getWorkflow
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowStatusEnvelope' } } } } }
  /workflow/validate:
    post:
      operationId: validateWorkflow
      description: "Validates the current filesystem WORKFLOW.md only. This endpoint is always dry-run: it does not replace effective config, update last-valid workflow state, render prompts, dispatch runs, or write review artifacts. Candidate workflow input belongs to /workflow/render-preview and is rejected here as invalid_request."
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowValidateRequest' } } }
      responses:
        "200":
          description: >
            Validation result for current filesystem WORKFLOW.md. Invalid workflow
            content is reported with data.validation.valid=false rather than replacing
            effective config.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowValidateEnvelope' } } }
        "400": { $ref: '#/components/responses/Error', description: "invalid_request when JSON is malformed, unknown fields are present, dry_run is false, or candidate workflow/render fields are supplied." }
  /workflow/render-preview:
    post:
      operationId: renderWorkflowPreview
      description: Dry-run rendering endpoint. It never replaces the effective config, persists rendered prompt content, dispatches runs, writes review artifacts, or returns raw secret/log/artifact content; successful responses contain only redacted preview data.
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRenderPreviewRequest' } } }
      responses:
        "200": { description: Redacted render preview, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRenderPreviewEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error' }
        "409": { $ref: '#/components/responses/Error' }
  /workflow/reload:
    post:
      operationId: reloadWorkflow
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0, description: "Request body is ignored by the current implementation; omit it or send an empty object." } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowReloadEnvelope' } } } }, "400": { $ref: '#/components/responses/Error', description: invalid_request for invalid mutation request body } }
  /diagnostics:
    get:
      operationId: getDiagnostics
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticsEnvelope' } } } } }
  /diagnostics/export:
    post:
      operationId: exportDiagnostics
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { include_raw_logs: { type: boolean, default: false } } } } } }
      responses:
        "200": { description: Export created, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticsExportEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: "invalid_request for malformed JSON or unknown fields; raw_log_access_not_supported when include_raw_logs=true" }
        "500": { $ref: '#/components/responses/Error', description: "internal_error when the export artifact metadata cannot be persisted." }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    cookieAuth: { type: apiKey, in: cookie, name: symphony_session }
  parameters:
    IssueRef:
      name: issue_ref
      in: path
      required: true
      schema: { type: string, description: Opaque issue id or human identifier like LOC-1 }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, pattern: "^run_" }
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: { type: string, pattern: "^apr_" }
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, pattern: "^art_" }
    SymphonyCSRF:
      name: X-Symphony-CSRF
      in: header
      required: false
      description: Required for cookie-authenticated command APIs. Bearer-token CLI calls do not use this header.
      schema: { type: string }
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE replay cursor; value is the last received event id.
      schema: { type: string }
  responses:
    Error:
      description: Error response
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ResponseMeta:
      type: object
      required: [request_id, server_time]
      additionalProperties: true
      properties:
        request_id: { type: string }
        server_time: { type: string, format: date-time }
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ApiError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ApiErrorCode' }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
    ApiErrorCode:
      type: string
