openapi: 3.1.0
info:
  title: Local Symphony App v1 API
  version: 1.0.0
  description: REST/SSE API contract for Local Symphony App v1. All business JSON success responses use the `{data, meta}` envelope.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "18080"
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HealthEnvelope' } } } }
  /state:
    get:
      operationId: getState
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppStateEnvelope' } } } }
  /events:
    get:
      operationId: listEvents
      parameters:
        - { name: after_seq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunEventPageEnvelope' } } } }
  /events/stream:
    get:
      operationId: streamEvents
      responses:
        "200": { description: SSE stream, content: { text/event-stream: { schema: { type: string } } } }
  /auth/exchange:
    post:
      operationId: exchangeOpenToken
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [open_token], additionalProperties: false, properties: { open_token: { type: string, minLength: 16 } } } } }
      responses:
        "200": { description: Browser session established, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSessionEnvelope' } } } }
        "401": { $ref: '#/components/responses/Error' }
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSessionEnvelope' } } } }
  /auth/logout:
    post:
      operationId: logout
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      responses:
        "204": { description: Logged out }
  /auth/open-token:
    post:
      operationId: createOpenToken
      description: >
        Used by CLI/open flow to mint a one-time browser open token. Requires a
        bearer local operator credential; cookie-authenticated browser sessions
        are not applicable for this endpoint, so X-Symphony-CSRF is not required.
      security:
        - bearerAuth: []
      responses:
        "200": { description: Open token, content: { application/json: { schema: { $ref: '#/components/schemas/OpenTokenEnvelope' } } } }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }
  /auth/cli-token/rotate:
    post:
      operationId: rotateCliToken
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      responses:
        "200": { description: Rotated CLI token, content: { application/json: { schema: { $ref: '#/components/schemas/CliTokenEnvelope' } } } }
  /issues:
    get:
      operationId: listIssues
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/IssueState' } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueListEnvelope' } } } }
    post:
      operationId: createIssue
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IssueCreateRequest' } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error' }
  /issues/{issue_ref}:
    get:
      operationId: getIssue
      parameters: [ { $ref: '#/components/parameters/IssueRef' } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "404": { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateIssue
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IssuePatchRequest' } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
  /issues/{issue_ref}/transition:
    post:
      operationId: transitionIssue
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IssueTransitionRequest' } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueTransitionEnvelope' } } } }
        "409": { $ref: '#/components/responses/Error' }
  /issues/{issue_ref}/comments:
    post:
      operationId: createIssueComment
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], additionalProperties: false, properties: { body: { type: string, minLength: 1 } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IssueCommentEnvelope' } } } }
  /issues/{issue_ref}/dispatch:
    post:
      operationId: dispatchIssue
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      responses:
        "202": { description: Dispatch accepted, content: { application/json: { schema: { $ref: '#/components/schemas/DispatchEnvelope' } } } }
        "409": { $ref: '#/components/responses/Error' }
  /issues/{issue_ref}/dispatch-pause:
    post:
      operationId: pauseIssueDispatch
      description: Pauses dispatch for a non-terminal issue, recording the non-empty operator reason in pause fields, event log, and issue comments.
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { description: Non-empty operator reason for audit comment/event., required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueDispatchControlEnvelope' } } } }, "409": { $ref: '#/components/responses/Error' } }
  /issues/{issue_ref}/dispatch-resume:
    post:
      operationId: resumeIssueDispatch
      description: Resumes dispatch for a non-terminal issue by clearing only dispatch pause fields; it never changes issue content, blockers, state, or creates a run.
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { description: Non-empty operator reason for audit comment/event., required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueDispatchControlEnvelope' } } } }, "409": { $ref: '#/components/responses/Error' } }
  /issues/{issue_ref}/blockers:
    post:
      operationId: addIssueBlocker
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [blocked_by], additionalProperties: false, properties: { blocked_by: { type: string } } } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IssueRelationEnvelope' } } } } }
  /issues/{issue_ref}/blockers/{blocker_issue_ref}:
    delete:
      operationId: removeIssueBlocker
      parameters:
        - { $ref: '#/components/parameters/IssueRef' }
        - { name: blocker_issue_ref, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/SymphonyCSRF' }
      x-csrf-required-for-cookie-auth: true
      responses: { "204": { description: Removed } }
  /issues/{issue_ref}/events/stream:
    get:
      operationId: streamIssueEvents
      parameters: [ { $ref: '#/components/parameters/IssueRef' } ]
      responses: { "200": { description: SSE stream, content: { text/event-stream: { schema: { type: string } } } } }
  /runs:
    get:
      operationId: listRuns
      parameters:
        - { name: issue_ref, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RunStatus' } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunListEnvelope' } } } } }
  /runs/{run_id}:
    get:
      operationId: getRun
      parameters: [ { $ref: '#/components/parameters/RunId' } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } } } } }
  /runs/{run_id}/events:
    get:
      operationId: listRunEvents
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: after_seq, in: query, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunEventPageEnvelope' } } } } }
  /runs/{run_id}/events/stream:
    get:
      operationId: streamRunEvents
      parameters: [ { $ref: '#/components/parameters/RunId' } ]
      responses: { "200": { description: SSE stream, content: { text/event-stream: { schema: { type: string } } } } }
  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters: [ { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { reason: { type: string } } } } } }
      responses: { "200": { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } } } } }
  /approvals:
    get:
      operationId: listApprovals
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalListEnvelope' } } } } }
  /approvals/{approval_id}/decide:
    post:
      operationId: decideApproval
      parameters: [ { $ref: '#/components/parameters/ApprovalId' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalEnvelope' } } } } }
  /reviews/{issue_ref}:
    get:
      operationId: getLatestReview
      parameters: [ { $ref: '#/components/parameters/IssueRef' } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPacketEnvelope' } } } } }
  /reviews/{issue_ref}/send-to-rework:
    post:
      operationId: sendToRework
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } } }
  /reviews/{issue_ref}/mark-done:
    post:
      operationId: markDone
      description: Requires latest generated review packet to belong to latest completed handoff run, with issue in Human Review and no active run.
      parameters: [ { $ref: '#/components/parameters/IssueRef' }, { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1, pattern: "\\S" } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error', description: "invalid_request when reason is missing or blank." }
        "409": { $ref: '#/components/responses/Error', description: "invalid_state_transition when issue is not in Human Review; review_packet_required when latest generated review packet is missing, non-generated, or mismatched; issue_already_running when an active run exists." }
  /artifacts/{artifact_id}:
    get:
      operationId: getArtifactMetadata
      parameters: [ { $ref: '#/components/parameters/ArtifactId' } ]
      responses: { "200": { description: Artifact metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactEnvelope' } } } } }
  /artifacts/{artifact_id}/content:
    get:
      operationId: getArtifactContent
      parameters: [ { $ref: '#/components/parameters/ArtifactId' } ]
      responses: { "200": { description: Artifact content, content: { application/octet-stream: { schema: { type: string, format: binary } } } }, "403": { $ref: '#/components/responses/Error' } }
  /workflow:
    get:
      operationId: getWorkflow
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowStatusEnvelope' } } } } }
  /workflow/validate:
    post:
      operationId: validateWorkflow
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowStatusEnvelope' } } } } }
  /workflow/render-preview:
    post:
      operationId: renderWorkflowPreview
      description: Dry-run rendering endpoint. It never replaces the effective config, persists rendered prompt content, dispatches runs, writes review artifacts, or returns raw secret/log/artifact content; successful responses contain only redacted preview data.
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRenderPreviewRequest' } } }
      responses:
        "200": { description: Redacted render preview, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRenderPreviewEnvelope' } } } }
        "400": { $ref: '#/components/responses/Error' }
        "409": { $ref: '#/components/responses/Error' }
  /workflow/reload:
    post:
      operationId: reloadWorkflow
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { dry_run: { type: boolean, default: false } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowStatusEnvelope' } } } } }
  /diagnostics:
    get:
      operationId: getDiagnostics
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticsEnvelope' } } } } }
  /diagnostics/export:
    post:
      operationId: exportDiagnostics
      parameters: [ { $ref: '#/components/parameters/SymphonyCSRF' } ]
      x-csrf-required-for-cookie-auth: true
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { include_raw_logs: { type: boolean, default: false } } } } } }
      responses: { "200": { description: Export created, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticsExportEnvelope' } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    cookieAuth: { type: apiKey, in: cookie, name: symphony_session }
  parameters:
    IssueRef:
      name: issue_ref
      in: path
      required: true
      schema: { type: string, description: Opaque issue id or human identifier like LOC-1 }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, pattern: "^run_" }
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: { type: string, pattern: "^appr_" }
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, pattern: "^art_" }
    SymphonyCSRF:
      name: X-Symphony-CSRF
      in: header
      required: false
      description: Required for cookie-authenticated command APIs. Bearer-token CLI calls do not use this header.
      schema: { type: string }
  responses:
    Error:
      description: Error response
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ResponseMeta:
      type: object
      required: [request_id, server_time]
      additionalProperties: true
      properties:
        request_id: { type: string }
        server_time: { type: string, format: date-time }
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ApiError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ApiErrorCode' }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
    ApiErrorCode:
      type: string
      enum: [unauthorized, forbidden, csrf_required, invalid_request, not_found, unsupported_db_version, workflow_invalid, workflow_validation_failed, prompt_render_failed, invalid_state_transition, issue_blocked, issue_dispatch_paused, issue_already_running, workspace_conflict, workspace_prepare_failed, after_create_failed, before_run_failed, codex_startup_failed, unsupported_codex_version, codex_protocol_error, turn_timeout, stall_timeout, approval_not_pending, approval_timeout, review_packet_required, review_packet_failed, tool_token_invalid, tool_gateway_failed, operator_cancelled, agent_blocked, issue_state_changed, canceled_by_reconciliation, daemon_restarted_run_interrupted, command_denied, network_denied, protected_path_denied, raw_log_access_not_supported, internal_error]
    FailureCode:
      type: string
      enum: [workflow_invalid, workflow_validation_failed, prompt_render_failed, workspace_prepare_failed, workspace_conflict, after_create_failed, before_run_failed, codex_startup_failed, unsupported_codex_version, codex_protocol_error, turn_timeout, stall_timeout, approval_timeout, command_denied, network_denied, protected_path_denied, tool_gateway_failed, missing_handoff, review_packet_failed, operator_cancelled, agent_blocked, issue_state_changed, canceled_by_reconciliation, daemon_restarted_run_interrupted]
    Health:
      type: object
      required: [status, project_id]
      properties: { status: { type: string, enum: [ok] }, project_id: { type: string } }
    HealthEnvelope:
      allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Health' } } } ]
    AppState:
      type: object
      required: [project_id, repo_root, daemon_pid, daemon, project, workflow, running_runs, pending_approvals, human_review, paused_issues, codex, recent_failures]
      properties:
        project_id: { type: string }
        repo_root: { type: string }
        daemon_pid: { type: integer }
        active_runs: { type: integer }
        daemon:
          type: object
          additionalProperties: true
        project:
          type: object
          additionalProperties: true
        workflow:
          type: object
          additionalProperties: true
        running_runs:
          type: array
          items: { type: object, additionalProperties: true }
        pending_approvals:
          type: array
          items: { type: object, additionalProperties: true }
        human_review:
          type: array
          items: { type: object, additionalProperties: true }
        paused_issues:
          type: array
          items: { type: object, additionalProperties: true }
        codex:
          type: object
          additionalProperties: true
        recent_failures:
          type: array
          items: { type: object, additionalProperties: true }
    AppStateEnvelope:
      allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AppState' } } } ]
    AuthSession:
      type: object
      required: [authenticated, csrf_token]
      properties:
        authenticated: { type: boolean }
        csrf_token: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
    AuthSessionEnvelope:
      allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AuthSession' } } } ]
    OpenToken:
      type: object
      required: [open_token, expires_at]
      additionalProperties: false
      properties:
        open_token: { type: string }
        expires_at: { type: string, format: date-time }
    OpenTokenEnvelope:
      allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/OpenToken' } } } ]
    CliToken:
      type: object
      required: [token, expires_at]
      additionalProperties: false
      properties:
        token: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
    CliTokenEnvelope:
      allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/CliToken' } } } ]
    IssueState:
      type: string
      enum: [Inbox, Ready, Working, Rework, Blocked, Human Review, Done, Cancelled, Duplicate]
    Issue:
      type: object
      required: [id, identifier, sequence_no, title, description, acceptance_criteria, priority, state, url, labels, blocked_by, blocks, dispatch_paused, dispatch_pause_reason, dispatch_paused_at, branch_name, workspace_path, base_ref, base_ref_config, base_sha, workspace, git, latest_run, active_run_id, latest_run_id, latest_review_packet, latest_review_packet_id, created_at, updated_at, completed_at, archived_at]
      properties:
        id: { type: string, pattern: "^iss_" }
        identifier: { type: string }
        sequence_no: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        acceptance_criteria: { type: array, items: { type: string } }
        state: { $ref: '#/components/schemas/IssueState' }
        priority: { type: integer, minimum: 1, maximum: 5 }
        url: { type: [string, 'null'] }
        labels: { type: array, items: { type: string } }
        blocked_by: { type: array, items: { $ref: '#/components/schemas/IssueRefSummary' } }
        blocks: { type: array, items: { $ref: '#/components/schemas/IssueRefSummary' } }
        dispatch_paused: { type: boolean }
        dispatch_pause_reason: { type: [string, 'null'] }
        dispatch_paused_at: { type: [string, 'null'], format: date-time }
        branch_name: { type: [string, 'null'] }
        workspace_path: { type: [string, 'null'] }
        base_ref: { type: [string, 'null'] }
        base_ref_config: { type: [string, 'null'] }
        base_sha: { type: [string, 'null'] }
        workspace:
          anyOf:
            - { $ref: '#/components/schemas/WorkspaceSummary' }
            - { type: 'null' }
        git:
          anyOf:
            - { $ref: '#/components/schemas/GitSummary' }
            - { type: 'null' }
        latest_run:
          anyOf:
            - { $ref: '#/components/schemas/RunSummary' }
            - { type: 'null' }
        active_run_id: { type: [string, 'null'], pattern: "^run_" }
        latest_run_id: { type: [string, 'null'], pattern: "^run_" }
        latest_review_packet:
          anyOf:
            - { $ref: '#/components/schemas/IssueReviewPacketSummary' }
            - { type: 'null' }
        latest_review_packet_id: { type: [string, 'null'], pattern: "^rp_" }
